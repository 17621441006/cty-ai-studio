<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover so env(safe-area-inset-*) reports real values on
         notched phones. maximum-scale/user-scalable are kept for the engines
         that still honour them, but iOS Safari has ignored them since iOS 10 —
         the `touch-action: none` below is what actually stops pinch-zoom, along
         with the gesture handlers in src/core/Input.ts. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>脏脏包 · 樱花卡丁车</title>

    <!-- Add to Home Screen, which on a phone is worth more than it sounds.
         Safari's toolbar and tab strip occupy roughly the top 220px of a
         landscape phone — about a quarter of the vertical space, in a game that
         is already short of height and whose menus had to be rebuilt to fit
         what was left. Launched from the home screen these tags drop the chrome
         entirely and the game gets the whole panel.

         `black-translucent` puts the status bar over the canvas rather than
         above it, which is what we want given `viewport-fit=cover` and the
         `env(safe-area-inset-*)` padding already in the HUD and menu CSS.

         The deprecated apple-prefixed name is kept alongside the standard one:
         iOS honours the former and nothing else reads it, while the standard
         `mobile-web-app-capable` is what every other engine looks for. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="脏脏包 · 樱花卡丁车" />
    <meta name="theme-color" content="#05070d" />
    <meta name="description" content="和脏脏包一起驶入樱花小镇，漂移、飞行，与朋友般的七名对手跑圈。" />
    <!-- iOS uses a game screenshot when no dedicated touch icon is supplied. -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="preload" as="image" href="./images/sakura-cover-v6.png" />
    <link rel="icon" type="image/svg+xml" href="./images/zangzangbao-kart-title.svg" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 100%; height: 100%; overflow: hidden; background: #05070d;
        /* the page is a game surface, not a document: no panning, no pinch,
           no double-tap zoom, no pull-to-refresh, no long-press callout */
        touch-action: none;
        overscroll-behavior: none;
        -webkit-user-select: none; user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
        position: fixed; inset: 0;
      }
      body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
      #app { position: fixed; inset: 0; }
      canvas { display: block; width: 100%; height: 100%; touch-action: none; }
      #ui { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="ui"></div>
    <nav id="mode-switch" aria-label="切换游戏风格">
      <a href="./index.html" aria-current="page">樱花卡丁车</a>
      
      <select id="kart-quality" aria-label="画质，切换会重新开始" title="切换画质会重新开始">
        <option value="low">省电</option><option value="medium">流畅</option>
      </select>
      <span id="kart-fps" title="最近的实际画面刷新率" aria-label="帧率">— FPS</span>
    </nav>

    <!-- Painted on the very first frame, before a single module has parsed, so
         the tab is never an unexplained black rectangle. main.ts advances it as
         each system initialises and removes it once the first real frame is up.
         Building a WebGL scene of this size takes a few seconds — the sky is
         raymarched into a PMREM probe, every texture is generated procedurally
         and every shader is compiled up front — and silence during that reads
         as a hang. -->
    <div id="boot">
      <div class="boot-in">
        <img class="boot-mark" src="./images/zangzangbao-kart-title.svg" alt="脏脏包 · 樱花卡丁车" width="1774" height="887" />
        <div class="boot-bar"><i></i></div>
        <div class="boot-step">正在启动</div>
      </div>
    </div>
    <style>
      #boot {
        position: fixed; inset: 0; z-index: 100; display: grid; place-items: center;
        background:
          linear-gradient(90deg,#191526d9 0%,#30233388 34%,transparent 64%), url(./images/sakura-cover-v6.png) center / cover no-repeat;
        color: #f3f6fb; transition: opacity .55s ease; font-family: system-ui, -apple-system, sans-serif;
      }
      #boot.done { opacity: 0; pointer-events: none; }
      .boot-in { width:46%; margin-right:auto; padding:4vw; display: flex; flex-direction: column; align-items: center; gap: 3.4vmin; }
      .boot-mark {
        width: min(100%, 620px); height: auto; max-height: 45vh; object-fit: contain;
        filter: drop-shadow(0 3px 10px rgba(0,0,0,.35));
      }
      .boot-bar {
        width: 42vmin; max-width: 380px; height: 5px; border-radius: 999px;
        background: rgba(255,255,255,.13); overflow: hidden;
      }
      .boot-bar i {
        display: block; width: 0%; height: 100%; border-radius: 999px;
        background: linear-gradient(90deg, #6ad2ff, #ffd27a);
        transition: width .3s ease; box-shadow: 0 0 12px rgba(255,200,120,.7);
      }
      .boot-step {
        font-size: 2.5vmin; letter-spacing: .22em; text-transform: uppercase;
        color: #fff4e9; text-shadow:0 1px 8px #15101f; min-height: 1.2em;
      }
      @media (prefers-reduced-motion: reduce) {
        #boot, .boot-bar i { transition: none; }
      }
    </style>
    <style>
      #mode-switch { position:fixed; z-index:101; left:50%; top:calc(env(safe-area-inset-top,0px) + 8px); transform:translateX(-50%); display:flex; gap:3px; padding:3px; border:1px solid #fff5; border-radius:24px; background:#222439df; box-shadow:0 4px 20px #16223833; white-space:nowrap; }
      #mode-switch a { display:flex; align-items:center; justify-content:center; min-height:32px; padding:0 12px; border-radius:20px; color:#fff7ef; text-decoration:none; font:700 12px/1 system-ui,-apple-system,sans-serif; touch-action:manipulation; }
      #mode-switch a[aria-current] { background:#ffe1e8; color:#702f4d; }
      #kart-quality { color:#f5eadf; background:#ffffff12; border:0; border-radius:18px; padding:0 8px; font:600 11px system-ui; cursor:pointer; }
      #kart-fps {font:600 10px system-ui;color:#d5d7d3;min-width:40px;align-self:center;text-align:center;}
      #kart-quality option { color:#302a34; background:#fff9f4; }
      .boot-error { max-width:80vw; text-align:center; font-size:15px; line-height:1.7; }
      .boot-retry { border:0; border-radius:24px; padding:14px 28px; background:#ffd3e1; color:#512c3f; font-size:16px; font-weight:700; cursor:pointer; }
      .boot-in > a { color:#ffd3e1; font-size:14px; }
      html .kr .kr-hud { top:calc(var(--safe) + env(safe-area-inset-top,0px) + 44px); }
      html .tc-root .tc-top { top:calc(env(safe-area-inset-top,0px) + 58px); }
      /* The cover keeps the familiar cinematic cat artwork while assets load. */
      html .kr-s-title { background: url(./images/sakura-cover-v6.png) center / cover no-repeat; }
      html .kr-s-title::before { background:linear-gradient(90deg,#1e1735e8 0%,#292039b0 39%,#201a3020 62%,transparent); backdrop-filter:none; -webkit-backdrop-filter:none; }
      html .kr-s-title.on > .kr-screen-in { position:absolute; left:0; top:55px; bottom:12px; width:48vw; max-height:none; padding:12px 3vw; justify-content:center; overflow-y:auto; }
      html .kr-s-title .kr-logo { width:100%; max-height:26vh; }
      html .kr-s-title .kr-sub { font-size:clamp(10px,1.45vmin,18px); letter-spacing:.15em; text-align:center; }
      html .kr-s-title .kr-prompt { margin-top:2vmin; animation:none; }
      html .kr-s-title .kr-hint { text-align:center; font-size:clamp(10px,1.4vmin,15px); }
      @media (orientation:portrait) {
        #boot { background-image:linear-gradient(0deg,#201726f0 0%,#2017269e 34%,transparent 63%),url(./images/sakura-cover-v6.png); background-position:65% center; }
        .boot-in { width:100%; margin:0; padding:0 8vw; position:absolute; bottom:9vh; gap:18px; }
        .boot-mark { width:80%; max-height:25vh; }
        .boot-bar { width:66vw; }
        .boot-step { font-size:13px; }
        html .kr-s-title { background-position:65% center; }
        html .kr-s-title::before { background:linear-gradient(0deg,#231a38f5 0%,#231a38d0 37%,transparent 57%); }
        html .kr-s-title.on > .kr-screen-in { left:0; top:53%; bottom:0; width:100%; padding:8px 24px calc(env(safe-area-inset-bottom,0px) + 12px); justify-content:flex-start; }
        html .kr-s-title .kr-logo { width:74vw; max-height:15vh; }
        html .kr-s-title .kr-prompt { margin-top:10px; font-size:14px; }
        html .kr-s-title .kr-glyphs { margin-top:10px; }
        html .kr-s-title .kr-gl > span { width:32px; height:32px; }
        html .kr-s-title .kr-gl { font-size:12px; }
        html .kr-s-title .kr-hint { margin-top:10px; font-size:10px; }
        html .kr-s-title .kr-btn-controls { min-height:38px; margin-top:8px; }

        html .kr .kr-timer { max-width:35vw; }
        html .kr .kr-map { top:100px; right:0; left:auto; width:110px; height:70px; }
        html[data-touch] .kr .kr-item { left:0; top:78px; width:50px; height:50px; }
        html[data-touch] .kr .kr-pos { top:159px; transform:scale(.62); transform-origin:0 0; }
        html[data-touch][data-touch-hand="left"] .kr .kr-pos { transform-origin:100% 0; }
        html[data-touch] .kr .kr-speed { left:auto; right:0; bottom:205px; --speed-s:.70; transform-origin:100% 100%; }
        html[data-touch][data-touch-hand="left"] .kr .kr-speed { left:0; right:auto; transform-origin:0 100%; }
        html .kr .kr-bottom { bottom:185px; width:150px; }
        html .tc-root .tc-top { left:50%; transform:translateX(-50%); top:calc(env(safe-area-inset-top,0px) + 57px); gap:5px; }
        html .tc-root .tc-chip { padding:0 9px; }
        html .kr-screen.on > .kr-screen-in { padding-top:68px; }
        html .kr-s-title.on > .kr-screen-in { padding-top:8px; }
      }
      @media (orientation:portrait) and (max-height:680px) { html .kr-s-title .kr-glyphs { display:none; } }
      @media (prefers-reduced-motion:reduce) { *, *::before, *::after { animation-duration:.001ms !important; transition-duration:.001ms !important; } }
    </style>
    <script>
      document.getElementById('mode-switch').addEventListener('pointerdown', function(e) { e.stopPropagation(); });
      document.getElementById('mode-switch').addEventListener('click', function(e) { e.stopPropagation(); });
    </script>
    <script type="module" src="/src/main.ts"></script>

  </body>
</html>
